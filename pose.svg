<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="t">
  <title id="t">Pose-estimation skeleton waving, detected as "bardia 0.99"</title>
  <!-- Colours are mid-tones on a transparent background so one file reads on GitHub light and dark. -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hud { fill: none; stroke: #8b949e; stroke-width: 2; stroke-linecap: round; }
    .hudtext { fill: #8b949e; font-size: 10px; }
    .bone { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .kp { fill: #fff; stroke-width: 3; }
    .head { stroke: #ec4899; } .torso { stroke: #f97316; }
    .armL { stroke: #8b5cf6; } .armR { stroke: #3b82f6; }
    .legL { stroke: #06b6d4; } .legR { stroke: #14b8a6; }

    .skeleton { animation: appear .6s .2s both; }
    .forearm { transform-origin: 238px 100px; animation: wave 2.6s 1s ease-in-out infinite; }
    .box { animation: jitter 3.2s 1.2s steps(1) infinite; }
    .box rect.frame { fill: none; stroke: #22c55e; stroke-width: 2.5;
      stroke-dasharray: 992; stroke-dashoffset: 992; animation: draw .8s .5s ease-out forwards; }
    .tag { animation: appear .3s 1.2s both; }
    .tag rect { fill: #22c55e; }
    .tag text { fill: #052e16; font-size: 13px; font-weight: 700; }
    .c1 { animation: flick 3.2s steps(1) infinite; }
    .c2 { animation: flick 3.2s -1.6s steps(1) infinite; }
    .scan { stroke: #22c55e; stroke-width: 1.5; opacity: 0; animation: scan 5s 1.5s linear infinite; }
    .live { fill: #ef4444; animation: blink 1.4s steps(1) infinite; }

    @keyframes appear { from { opacity: 0 } to { opacity: 1 } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes wave {
      0%, 70%, 100% { transform: rotate(0deg) }
      12%, 42% { transform: rotate(-22deg) }
      27%, 57% { transform: rotate(18deg) }
    }
    @keyframes jitter {
      0%, 100% { transform: translate(0, 0) }
      20% { transform: translate(1px, -1px) }
      45% { transform: translate(-1px, 0) }
      70% { transform: translate(0, 1px) }
    }
    @keyframes flick { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0 }
      5% { opacity: .45 }
      35% { opacity: .45 }
      40%, 100% { transform: translateY(296px); opacity: 0 }
    }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .box rect.frame { stroke-dashoffset: 0; }
      .c2 { opacity: 0; }
    }
  </style>

  <!-- camera viewfinder -->
  <path class="hud" d="M6 26V6h20M294 6h20v20M314 334v20h-20M26 354H6v-20"/>
  <circle class="live" cx="272" cy="20" r="3.5"/>
  <text class="hudtext" x="306" y="24" text-anchor="end">LIVE</text>
  <text class="hudtext" x="14" y="347">17 keypoints · 30 fps</text>

  <line class="scan" x1="84" y1="35" x2="278" y2="35"/>

  <g class="skeleton">
    <!-- bones -->
    <path class="bone head" d="M141 76L151 70L160 78L169 70L179 76M160 78V122"/>
    <path class="bone torso" d="M125 122H195L182 212H138Z"/>
    <path class="bone armL" d="M125 122L108 168L102 212"/>
    <path class="bone armR" d="M195 122L238 100"/>
    <path class="bone legL" d="M138 212L134 264L131 316"/>
    <path class="bone legR" d="M182 212L186 264L189 316"/>
    <!-- keypoints -->
    <g class="kp head">
      <circle cx="160" cy="78" r="4"/><circle cx="151" cy="70" r="3"/><circle cx="169" cy="70" r="3"/>
      <circle cx="141" cy="76" r="3"/><circle cx="179" cy="76" r="3"/>
    </g>
    <g class="kp torso">
      <circle cx="125" cy="122" r="5"/><circle cx="195" cy="122" r="5"/>
      <circle cx="138" cy="212" r="5"/><circle cx="182" cy="212" r="5"/>
    </g>
    <g class="kp armL"><circle cx="108" cy="168" r="5"/><circle cx="102" cy="212" r="5"/></g>
    <g class="kp legL"><circle cx="134" cy="264" r="5"/><circle cx="131" cy="316" r="5"/></g>
    <g class="kp legR"><circle cx="186" cy="264" r="5"/><circle cx="189" cy="316" r="5"/></g>
    <!-- waving forearm, pivots on the elbow -->
    <g class="forearm">
      <path class="bone armR" d="M238 100L250 52"/>
      <circle class="kp armR" cx="250" cy="52" r="5"/>
    </g>
    <circle class="kp armR" cx="238" cy="100" r="5"/>
  </g>

  <!-- detection box -->
  <g class="box">
    <rect class="frame" x="82" y="34" width="198" height="298"/>
    <g class="tag">
      <rect x="80.75" y="12" width="106" height="22"/>
      <text class="c1" x="88" y="27">bardia 0.99</text>
      <text class="c2" x="88" y="27">bardia 0.98</text>
    </g>
  </g>
</svg>
